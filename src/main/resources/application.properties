# =============================================
# Spring Boot CRUD Application Configuration
# =============================================

# -------------------------------------------------------
# PORT: Railway akan otomatis set $PORT, ini fallback-nya
# -------------------------------------------------------
server.port=${PORT:8080}

# =============================================
# LOCAL Development - H2 In-Memory Database
# (aktif saat env DATABASE_URL tidak ada)
# =============================================
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:productdb}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# H2 Console (hanya untuk local, nonaktif di production)
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console

# =============================================
# PRODUCTION (Railway) - PostgreSQL
# =============================================
# Railway otomatis menyediakan env variable DATABASE_URL
# Format: postgresql://user:password@host:port/dbname
#
# Set env variables berikut di Railway dashboard:
#   DATABASE_URL  = postgresql://...  (otomatis dari Railway PostgreSQL plugin)
#   DB_DRIVER     = org.postgresql.Driver
#   H2_CONSOLE    = false
#
# Untuk force PostgreSQL dialect:
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

