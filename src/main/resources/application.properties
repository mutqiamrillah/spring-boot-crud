# =============================================
# Spring Boot CRUD Application Configuration
# =============================================

# PORT: Railway set $PORT otomatis, fallback ke 8080
server.port=${PORT:8080}

# =============================================
# DATABASE - PostgreSQL
# Local  : jdbc:postgresql://localhost:5432/productdb
# Railway: otomatis dari env DATABASE_URL
# =============================================
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:productdb}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${PGUSER:mutqiamrillah}
spring.datasource.password=${PGPASSWORD:}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# H2 Console — nonaktif karena sudah pakai PostgreSQL
spring.h2.console.enabled=false

# =============================================
# PRODUCTION (Railway)
# =============================================
# Railway otomatis inject DATABASE_URL dari PostgreSQL plugin.
# Pastikan env variables berikut diset di Railway dashboard:
#   DB_USERNAME = (kosongkan, sudah ada di DATABASE_URL)
#   DB_PASSWORD = (kosongkan, sudah ada di DATABASE_URL)

